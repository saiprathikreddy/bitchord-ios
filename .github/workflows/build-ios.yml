name: Build BitChord iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          echo "Xcode: $(xcodebuild -version | head -n 1)"

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      - name: Build Swift package (verify compilation)
        run: swift build --configuration release

      - name: Build status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Build succeeded. Code compiles for iOS."
            echo "To get a sideloadable .ipa:"
            echo "  1. Clone this repo on a Mac"
            echo "  2. Open the folder in Xcode (it auto-detects the Swift Package)"
            echo "  3. Select your Apple ID team under Signing & Capabilities"
            echo "  4. Product → Archive → Distribute App → export .ipa"
            echo "  5. Sideload via Sideloadly/AltStore"
          else
            echo "Build failed. Check logs above."
          fi
