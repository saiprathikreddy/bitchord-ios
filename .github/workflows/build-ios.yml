name: Build BitChord iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          echo "Xcode: $(xcodebuild -version | head -n 1)"

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      - name: Generate Xcode project from Swift Package
        run: swift package generate-xcodeproj --output BitChord.xcodeproj

      - name: Show available schemes
        run: xcodebuild -list -project BitChord.xcodeproj

      - name: Build for iOS Simulator (Release)
        run: |
          xcodebuild -project BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,OS=17.0,name=iPhone 15" \
            build

      - name: Build status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Build succeeded. Open BitChord.xcodeproj in Xcode, select your team, Product → Archive to create .ipa for sideloading."
          else
            echo "Build failed. Check logs above."
          fi
